# ═══════════════════════════════════════════════════════════
# CBOS Platform — Docker Compose PRODUCCIÓN
#
# Arquitectura: Traefik → backend:8000 (/api/, /health)
#                       → frontend:80  (todo lo demás)
# Sin nginx intermedio — Traefik enruta directo a cada servicio.
#
# Variables requeridas en Dokploy (sin defaults):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   REDIS_PASSWORD, SECRET_KEY, DOMAIN
#   FROM_EMAIL, ANTHROPIC_API_KEY
# ═══════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    labels:
      - "traefik.enable=false"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    labels:
      - "traefik.enable=false"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ── Backend ──────────────────────────────────────────────────────────────
  # entrypoint.sh corre alembic upgrade head antes de arrancar uvicorn.
  # Traefik enruta /api/ directamente aquí (sin nginx intermedio).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      PORTAL_BASE_URL: https://${DOMAIN}
      PORTAL_TOKEN_EXPIRE_HOURS: ${PORTAL_TOKEN_EXPIRE_HOURS:-72}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-CBOS Platform}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTPS — /api/ y /health → backend:8000
      - "traefik.http.routers.cbos-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || Path(`/health`))"
      - "traefik.http.routers.cbos-api.entrypoints=websecure"
      - "traefik.http.routers.cbos-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.cbos-api.loadbalancer.server.port=8000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.cbos-api-http.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || Path(`/health`))"
      - "traefik.http.routers.cbos-api-http.entrypoints=web"
      - "traefik.http.routers.cbos-api-http.middlewares=cbos-https-redirect@docker"
      # Define el middleware de redirect (compartido con frontend)
      - "traefik.http.middlewares.cbos-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.cbos-https-redirect.redirectscheme.permanent=true"

  # ── Frontend (React build → nginx static) ────────────────────────────────
  # Traefik enruta todo lo que no sea /api/ directamente aquí.
  frontend:
    build:
      context: ./composable-os
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
    expose:
      - "80"
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # HTTPS — / → frontend:80
      - "traefik.http.routers.cbos-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cbos-frontend.entrypoints=websecure"
      - "traefik.http.routers.cbos-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.cbos-frontend.loadbalancer.server.port=80"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.cbos-frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cbos-frontend-http.entrypoints=web"
      - "traefik.http.routers.cbos-frontend-http.middlewares=cbos-https-redirect@docker"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  dokploy-network:
    external: true
