# ═══════════════════════════════════════════════════════════
# CBOS Platform — Docker Compose PRODUCCIÓN
#
# Uso en Dokploy:
#   - Apuntar al repo, seleccionar este archivo como compose
#   - Variables de entorno se configuran en el UI de Dokploy
#   - SSL/TLS y dominio manejados por Traefik (built-in Dokploy)
#   - Traefik enruta dbos.inbounduxd.com → nginx:80 via labels
#
# Variables requeridas en Dokploy (sin defaults):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   REDIS_PASSWORD, SECRET_KEY, DOMAIN
#   FROM_EMAIL, ANTHROPIC_API_KEY
# ═══════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ── Backend ──────────────────────────────────────────────────────────────
  # entrypoint.sh corre alembic upgrade head antes de arrancar uvicorn
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      PORTAL_BASE_URL: https://${DOMAIN}
      PORTAL_TOKEN_EXPIRE_HOURS: ${PORTAL_TOKEN_EXPIRE_HOURS:-72}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-CBOS Platform}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ── Frontend (React build → nginx static) ────────────────────────────────
  frontend:
    build:
      context: ./composable-os
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
    expose:
      - "80"
    restart: always

  # ── Nginx (único punto de entrada → Traefik) ─────────────────────────────
  # NO usa ports — Traefik enruta al contenedor via dokploy-network + labels.
  # Puerto 80 del host pertenece a Traefik, no a nginx.
  nginx:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cbos.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cbos.entrypoints=websecure"
      - "traefik.http.routers.cbos.tls.certresolver=letsencrypt"
      - "traefik.http.services.cbos.loadbalancer.server.port=80"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.cbos-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cbos-http.entrypoints=web"
      - "traefik.http.routers.cbos-http.middlewares=redirect-to-https@docker"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  dokploy-network:
    external: true
