name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce governance update policy
        run: bash scripts/ci/check_governance.sh "${{ steps.diff.outputs.base_sha }}" "${{ steps.diff.outputs.head_sha }}"

      - name: Enforce event registry parity
        run: python scripts/ci/check_event_registry.py

  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cbos_test
          POSTGRES_USER: cbos
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      # conftest.py reads TEST_DATABASE_URL (falls back to docker-internal default)
      TEST_DATABASE_URL: postgresql+asyncpg://cbos:testpassword@localhost:5432/cbos_test
      DATABASE_URL: postgresql+asyncpg://cbos:testpassword@localhost:5432/cbos_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      PORTAL_BASE_URL: http://localhost:5173
      FROM_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q

  frontend:
    name: Frontend — check, test & build
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 10

    defaults:
      run:
        working-directory: composable-os

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: composable-os/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc --noEmit` a secas no chequeaba nada: tsconfig.json es
      # solution-style ("files": [] mas referencias), asi que sin modo build
      # tsc no recolecta ningun archivo y siempre salia con codigo 0.
      - name: Type-check
        run: npm run typecheck

      # Bloqueante sobre errores. Quedan 8 warnings de
      # react-refresh/only-export-components, inherentes al patron de shadcn
      # de exportar variantes junto al componente: eslint sale con 0 ante
      # warnings, asi que no frenan el pipeline.
      - name: Lint
        run: npm run lint

      # Solo los unitarios de vitest (jsdom, sin dependencias externas). Los
      # e2e de Playwright viven en composable-os/e2e y no corren aca: necesitan
      # el stack levantado contra una base de datos real.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com/api/v1

  e2e:
    name: Frontend — e2e
    runs-on: ubuntu-latest
    # Detras de las comprobaciones rapidas: no tiene sentido levantar el stack
    # entero si el backend o el type-check ya fallaron.
    needs: [backend, frontend]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: composable-os/package-lock.json

      # Antes de levantar el stack, a proposito. El compose monta un volumen
      # nombrado en /app/node_modules y, como /app es un bind mount del host,
      # Docker crea ese directorio en el host como root. Si eso pasa primero,
      # `npm ci` corre como `runner` y falla con EACCES. Creando node_modules
      # aqui, el directorio ya existe y pertenece al usuario correcto.
      - name: Instalar dependencias y navegador
        working-directory: composable-os
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Los e2e llaman a la API por rutas relativas (/api/v1/...), que dependen
      # del proxy de nginx. Levantar el stack con compose reproduce la
      # topologia real en lugar de inventar un proxy solo para CI.
      - name: Levantar el stack
        run: docker compose up -d --build

      - name: Esperar a que la aplicacion responda
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost/ >/dev/null \
               && [ "$(curl -s -o /dev/null -w '%{http_code}' \
                       http://localhost/api/v1/accounting/company-profile)" = "401" ]; then
              echo "stack listo tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "el stack no respondio a tiempo"; docker compose ps; docker compose logs --tail 80; exit 1

      - name: Correr los e2e
        working-directory: composable-os
        run: npm run test:e2e

      # Trazas y capturas de los casos que fallaron: sin esto, un fallo en CI
      # solo deja el mensaje de la asercion.
      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: composable-os/test-results/
          retention-days: 7

      - name: Logs del stack si algo fallo
        if: failure()
        run: docker compose logs --tail 200
