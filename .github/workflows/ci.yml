name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce governance update policy
        run: bash scripts/ci/check_governance.sh "${{ steps.diff.outputs.base_sha }}" "${{ steps.diff.outputs.head_sha }}"

      - name: Enforce event registry parity
        run: python scripts/ci/check_event_registry.py

  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cbos_test
          POSTGRES_USER: cbos
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      # conftest.py reads TEST_DATABASE_URL (falls back to docker-internal default)
      TEST_DATABASE_URL: postgresql+asyncpg://cbos:testpassword@localhost:5432/cbos_test
      DATABASE_URL: postgresql+asyncpg://cbos:testpassword@localhost:5432/cbos_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENVIRONMENT: test
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      PORTAL_BASE_URL: http://localhost:5173
      FROM_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --tb=short -q

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    needs: governance
    timeout-minutes: 10

    defaults:
      run:
        working-directory: composable-os

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: composable-os/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (non-blocking — legacy warnings in non-wedge pages)
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://example.com/api/v1
