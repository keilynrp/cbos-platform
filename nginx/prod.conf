# `Connection: upgrade` fijo se manda tambien en peticiones HTTP normales, que
# no piden ningun upgrade. Derivarlo del header del cliente deja `close` cuando
# no hay handshake, que es lo que dice el protocolo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ── Docker DNS resolver — re-resolve upstreams on every request ──────────
    # Without this, nginx caches the IP at startup and fails after container
    # restarts (new IP). 127.0.0.11 is Docker's internal DNS resolver.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 20M;

    # ── WebSocket (real-time notifications) ─────────────────────────────────
    # La ruta real es /api/v1/ws/notifications. El prefijo que habia aqui,
    # /api/v1/notifications/ws/, no casaba con nada: el handshake caia en
    # /api/, que no manda las cabeceras de upgrade, y el backend devolvia 404.
    location /api/v1/ws/ {
        set $upstream_backend http://backend:8000;
        proxy_pass         $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── API Backend ──────────────────────────────────────────────────────────
    location /api/ {
        set $upstream_backend http://backend:8000;
        proxy_pass         $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Frontend (static SPA via frontend container) ─────────────────────────
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept-Encoding   "";
    }
}
