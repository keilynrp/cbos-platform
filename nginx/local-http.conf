# ── HTTP (no SSL) ──────────────────────────────────────────────────────────
# Local development config — no certificate required.
# For SSL (production-parity), use local-ssl.conf + mkcert -install.

# `Connection: upgrade` fijo se manda tambien en peticiones HTTP normales, que
# no piden ningun upgrade. Derivarlo del header del cliente deja `close` cuando
# no hay handshake, que es lo que dice el protocolo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # ── API Backend ─────────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8000;

    # ── WebSocket de notificaciones ─────────────────────────────────────────
    # Bloque propio, y antes que /api/, por dos razones: el handshake necesita
    # las cabeceras de upgrade que /api/ no manda, y una conexion persistente
    # no sobrevive al proxy_read_timeout de 120s pensado para peticiones.
    location /api/v1/ws/ {
        proxy_pass         $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass         $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Frontend (Vite dev server + HMR WebSocket) ───────────────────────────
    set $frontend_upstream http://frontend:8101;

    location / {
        proxy_pass         $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto http;
        proxy_read_timeout 86400s;
    }
}
