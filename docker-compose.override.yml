# ═══════════════════════════════════════════════════════════
# CBOS Platform — Override LOCAL (solo desarrollo)
#
# Docker Compose fusiona este archivo con docker-compose.yml
# automáticamente. Dokploy usa docker-compose.prod.yml de forma
# explícita, por lo que este archivo NUNCA llega a producción.
#
# Modo HTTP (sin SSL) — no requiere mkcert -install.
# Para modo HTTPS, cambiar a local-ssl.conf y VITE_API_URL https.
# ═══════════════════════════════════════════════════════════

services:

  # ── Nginx HTTP (sin SSL, no requiere certificado) ───────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/local-http.conf:/etc/nginx/conf.d/default.conf:ro

  # ── Frontend: apuntar API a la URL HTTP local ───────────
  frontend:
    environment:
      VITE_API_URL: http://localhost/api/v1

volumes: {}
