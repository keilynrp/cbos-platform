# ═══════════════════════════════════════════════════════════
# CBOS Platform — Override LOCAL (solo desarrollo)
#
# Docker Compose fusiona este archivo con docker-compose.yml
# automáticamente. Dokploy usa docker-compose.prod.yml de forma
# explícita, por lo que este archivo NUNCA llega a producción.
#
# Modo HTTP (sin SSL) — no requiere mkcert -install.
# Para modo HTTPS, cambiar a local-ssl.conf y VITE_API_URL https.
# ═══════════════════════════════════════════════════════════

services:

  # ── Backend: watcher de --reload ────────────────────────
  backend:
    environment:
      # watchfiles fuerza polling por su cuenta al ver un kernel
      # "*-microsoft-standard-WSL2", asumiendo que el codigo llega por /mnt/c.
      # Con el repo en ext4 dentro de la distro esa heuristica es un falso
      # positivo que cuesta ~30% de un core en reposo: inotify funciona. Si
      # alguna vez levantas esto desde /mnt/*, pon WATCHFILES_FORCE_POLLING=true
      # en el .env raiz o el --reload dejara de detectar cambios.
      WATCHFILES_FORCE_POLLING: "${WATCHFILES_FORCE_POLLING:-false}"

  # ── Nginx HTTP (sin SSL, no requiere certificado) ───────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/local-http.conf:/etc/nginx/conf.d/default.conf:ro

  # ── Frontend: apuntar API a la URL HTTP local ───────────
  frontend:
    environment:
      VITE_API_URL: http://localhost/api/v1
      # En ext4 (repo dentro de WSL) inotify funciona y esto sobra: dejalo en
      # false. Solo hace falta si el repo vive en NTFS (/mnt/d, /mnt/c), donde
      # los eventos no cruzan el bind mount y el HMR conecta pero nunca recibe
      # updates. Se activa con VITE_USE_POLLING=true en el .env raiz.
      VITE_USE_POLLING: "${VITE_USE_POLLING:-false}"
    volumes:
      # El codigo se monta desde el host; node_modules vive en un volumen
      # nombrado. Asi el contenedor no pisa las dependencias del entorno
      # nativo (dev-native.sh) ni al reves, y el arranque no reinstala.
      - ./composable-os:/app
      - frontend_node_modules:/app/node_modules
    # El comando base corre `npm install` en CADA arranque. Aqui solo se
    # instala si faltan las dependencias o si package-lock.json cambio
    # despues de la ultima instalacion — mismo criterio que dev-native.sh.
    command: >
      sh -c "if [ ! -d node_modules/vite ] || [ package-lock.json -nt node_modules ]; then
               npm ci --no-audit --no-fund && touch node_modules;
             fi;
             npm run dev -- --host 0.0.0.0 --port 8101"

volumes:
  frontend_node_modules:
